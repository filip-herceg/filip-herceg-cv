name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Audit (fail on critical)
        run: |
          audit_output=$(npm audit --json || true)
          echo "$audit_output" > audit.json
          critical=$(echo $audit_output | jq '.metadata.vulnerabilities.critical')
          echo "Critical vulnerabilities: $critical"
          if [ "$critical" != "0" ]; then echo "Failing due to critical vulns" && exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit.json
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
      - name: Generate coverage badge json
        if: always()
        run: |
          pct=$(grep -m1 'All files' coverage/lcov-report/index.html | sed -E 's/.*Statements[^0-9]*([0-9]+\.?[0-9]*).*/\1/' || echo 0)
          color=red
          awk "BEGIN{exit ($pct>=90)?0:1}" && color=brightgreen || (awk "BEGIN{exit ($pct>=80)?0:1}" && color=yellow || true)
          echo '{"schemaVersion":1,"label":"coverage","message":"'"'$pct%'"'","color":"'"'$color'"'"}' > coverage-badge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-badge
          path: coverage-badge.json
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint ./helm
      - name: Validate rendered Helm templates (kubeconform)
        run: |
          helm template web ./helm --values ./helm/values.yaml > rendered.yaml
          docker run --rm -v "$PWD":/manifests ghcr.io/yannh/kubeconform:latest \
            -strict -ignore-missing-schemas -summary /manifests/rendered.yaml
      - name: Dry-run install chart
        run: |
          helm template web ./helm --values ./helm/values.yaml --debug >/dev/null
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --redact --report-format sarif --report-path gitleaks.sarif
      - name: Upload SARIF (gitleaks)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.32.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'HIGH,CRITICAL'
      - name: Upload SARIF (trivy fs)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
  lighthouse:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: |
          npm start & npx wait-on http://localhost:3000 && npx @lhci/cli autorun
        env:
          PORT: 3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
  a11y:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run pa11y-ci against local server
        run: |
          npm start &
          npx wait-on http://localhost:3000
          npx pa11y-ci
        env:
          PORT: 3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-screens
          path: pa11y-screenshots
  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results
  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build-test
      - e2e
      - lighthouse
      - static-analysis
      - security-audit
      - codeql
      - trivy-fs
      - gitleaks
      - dependency-review
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
      - name: Capture image digest
        id: digest
        run: |
          d=$(docker inspect ghcr.io/${{ github.repository }}:${{ github.sha }} --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "digest=$d" >> $GITHUB_OUTPUT
          echo "$d" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
  supply-chain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v5
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}:latest
          output-file: sbom.spdx.json
      - name: Scan image (grype)
        uses: anchore/scan-action@v6
        with:
          image: ghcr.io/${{ github.repository }}:latest
          fail-build: false
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-artifacts
          path: |
            sbom.spdx.json
  canary-kind:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Download image digest
        uses: actions/download-artifact@v4
        with:
          name: image-digest
      - name: Read digest
        id: d
        run: echo "digest=$(cat image-digest.txt)" >> $GITHUB_OUTPUT
      - name: Create kind cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: canary
      - name: Pull + load image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          kind load docker-image ghcr.io/${{ github.repository }}:${{ github.sha }} --name canary
      - name: Helm install (canary)
        run: |
          helm upgrade --install web ./helm \
            --namespace canary --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ github.sha }} \
            --set image.digest=${{ steps.d.outputs.digest }} \
            --set ingress.enabled=false
      - name: Wait for rollout
        run: kubectl rollout status deployment/web -n canary --timeout=120s
      - name: Logs
        run: kubectl logs deployment/web -n canary --tail=50 || true
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - supply-chain
      - canary-kind
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Retag & push docker image with release version
        env:
          GH_REPO: ghcr.io/${{ github.repository }}
        run: |
          if [ ! -f package.json ]; then echo "package.json missing"; exit 1; fi
          version=$(jq -r .version package.json)
          echo "Version: $version"
          if [ -z "$version" ] || [ "$version" = "null" ]; then echo "No version found"; exit 0; fi
          echo "Pulling latest image"
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          docker pull $GH_REPO:latest
          docker tag $GH_REPO:latest $GH_REPO:$version
          docker tag $GH_REPO:latest $GH_REPO:v$version
          docker push $GH_REPO:$version
          docker push $GH_REPO:v$version
  summary:
    runs-on: ubuntu-latest
    needs:
      - build-test
      - static-analysis
      - security-audit
      - gitleaks
      - trivy-fs
      - codeql
      - lighthouse
      - a11y
      - e2e
    if: always()
    steps:
      - name: Generate summary
        run: |
          cat <<EOF > ci-summary.txt
          Build/Test: ${{ needs.build-test.result }}
          Static Analysis: ${{ needs.static-analysis.result }}
          Security Audit: ${{ needs.security-audit.result }}
          Gitleaks: ${{ needs.gitleaks.result }}
          Trivy FS: ${{ needs.trivy-fs.result }}
          CodeQL: ${{ needs.codeql.result }}
          Lighthouse: ${{ needs.lighthouse.result }}
          Accessibility: ${{ needs.a11y.result }}
          E2E: ${{ needs.e2e.result }}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ci-summary.txt

  coverage-badge-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage badge JSON
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge
      - name: Generate coverage SVG
        run: |
          set -e
          data=$(cat coverage-badge.json)
          label=$(echo "$data" | jq -r .label)
          message=$(echo "$data" | jq -r .message)
          colorName=$(echo "$data" | jq -r .color)
          case "$colorName" in
            brightgreen) colorHex="#4c1" ;;
            yellow) colorHex="#dfb317" ;;
            *) colorHex="#e05d44" ;;
          esac
          # crude width calc (char * 6 + padding)
          label_w=$(( ${#label} * 6 + 20 ))
          msg_w=$(( ${#message} * 6 + 20 ))
            total_w=$(( label_w + msg_w ))
          cat > coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="${total_w}" height="20" role="img" aria-label="${label}: ${message}">
            <linearGradient id="smooth" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="round"><rect width="${total_w}" height="20" rx="3" fill="#fff"/></mask>
            <g mask="url(#round)">
              <rect width="${label_w}" height="20" fill="#555"/>
              <rect x="${label_w}" width="${msg_w}" height="20" fill="${colorHex}"/>
              <rect width="${total_w}" height="20" fill="url(#smooth)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="$((label_w/2))" y="15" fill="#010101" fill-opacity=".3">${label}</text>
              <text x="$((label_w/2))" y="14">${label}</text>
              <text x="$((label_w + msg_w/2))" y="15" fill="#010101" fill-opacity=".3">${message}</text>
              <text x="$((label_w + msg_w/2))" y="14">${message}</text>
            </g>
          </svg>
          EOF
      - name: Commit & push badge
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B badges
          mkdir -p badges
          mv coverage.svg badges/coverage.svg
          cp coverage-badge.json badges/coverage.json
          git add badges/coverage.svg badges/coverage.json
          git commit -m "chore: update coverage badge [skip ci]" || echo "No changes to commit"
          git push origin badges

name: Canary Deploy
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to canary'
        required: true
      percentage:
        description: 'Traffic percentage (annotation hint)'
        required: false
        default: '10'
permissions:
  contents: read
  id-token: write
  packages: read
concurrency:
  group: canary-deploy
  cancel-in-progress: true
jobs:
  canary:
    runs-on: ubuntu-latest
    # environment: staging  # Uncomment after creating 'staging' environment in repository settings
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Deploy canary (separate release)
        run: |
          helm upgrade --install cv-canary ./helm \
            --namespace cv --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ inputs.image_tag }} \
            --set replicaCount=1 \
            --set podAnnotations.canary=true \
            --set podAnnotations.traffic=${{ inputs.percentage }} \
            --atomic --timeout 5m
      - name: Post info
        run: |
          echo "Canary deployed tag=${{ inputs.image_tag }} percent=${{ inputs.percentage }}"

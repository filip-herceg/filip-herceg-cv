name: Deploy Prod
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version/tag (leave blank for latest release)'
        required: false
      environment:
        description: 'Target environment name'
        required: false
        default: production
  push:
    tags:
      - 'v*.*.*'
concurrency:
  group: deploy-prod
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  packages: read
jobs:
  deploy:
    environment:
      name: production
      url: https://example.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set IMAGE_TAG
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Render chart (dry-run)
        run: |
          helm upgrade --install cv ./helm \
            --namespace cv --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --dry-run --atomic
      - name: Deploy
        run: |
          helm upgrade --install cv ./helm \
            --namespace cv --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --atomic --timeout 5m

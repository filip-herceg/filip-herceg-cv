name: CI Quality
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    name: Lint • Typecheck • Test • Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install deps (ci)
        run: npm ci
      - name: Docs legacy guard
        run: npm run docs:guard
      - name: Docs links check
        run: npm run docs:links
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: |
          npm run reports:ensure
          npm run lint:ci
          npm run lint:report || true
      - name: Typecheck
        run: npm run typecheck
      - name: Legacy types/ grace-period check
        env:
          GRACE_EXPIRES: '2025-09-22'
        run: |
          if [ -d "types" ]; then
            NOW=$(date -u +%Y-%m-%d)
            if [ "$NOW" \< "$GRACE_EXPIRES" ] || [ "$NOW" = "$GRACE_EXPIRES" ]; then
              echo "::warning::Legacy 'types/' folder still exists. All declarations should be under 'src/types/'. Remove 'types/' before $GRACE_EXPIRES."
            else
              echo "::error::Legacy 'types/' folder found after grace period ($GRACE_EXPIRES). Please delete 'types/' and migrate declarations to 'src/types/'."
              exit 1
            fi
          fi
      - name: Root hygiene guard
        run: node scripts/check-root-artifacts.mjs
      - name: Build
        run: npm run build
      - name: Tests (with coverage)
        run: npm test -- --coverage
      - name: Visual baselines verify
        run: npm run test:visual:verify
      - name: Generate visual variance report
        run: npm run test:visual:variance
      - name: Upload visual variance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-variance
          path: reports/tests/visual-variance
          retention-days: 7
      - name: Visual variance summary
        if: always()
        run: npm run test:visual:variance:summary
      - name: Upload reports (lint, docs, budgets)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports
          retention-days: 7
      - name: Package build artifact
        run: |
          tar -czf build-artifact.tgz .next
      - name: Extract coverage % & badge json
        run: |
          pct=$(grep -m1 'All files' coverage/lcov-report/index.html | sed -E 's/.*Statements[^0-9]*([0-9]+\.?[0-9]*).*/\1/' || echo 0)
          color=red
          awk "BEGIN{exit ($pct>=90)?0:1}" && color=brightgreen || (awk "BEGIN{exit ($pct>=80)?0:1}" && color=yellow || true)
          echo '{"schemaVersion":1,"label":"coverage","message":"'"'$pct%'","color":"'$color'"}' > coverage-badge.json
          echo "coverage=$pct" >> $GITHUB_OUTPUT
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
      - name: Upload coverage badge json
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build-artifact.tgz
          retention-days: 3
  summary:
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: |
          echo "Quality job: ${{ needs.quality.result }}" > summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-quality-summary
          path: summary.txt

name: Deploy Staging
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (default latest)'
        required: false
      promote_to_prod:
        description: 'Automatically trigger prod deploy if successful'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
concurrency:
  group: deploy-staging
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
  packages: read
env:
  NAMESPACE: cv-staging
jobs:
  deploy:
    # environment: staging  # Uncomment after creating the 'staging' environment in repo settings
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image (validate tag exists)
        run: docker pull ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install cv ./helm \
            --namespace $NAMESPACE --create-namespace \
            -f helm/values-staging.yaml \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --atomic --timeout 5m
      - name: Output note
        run: echo "Staging deployed tag=${{ steps.tag.outputs.tag }}"
  promote:
    if: ${{ success() && github.event.inputs.promote_to_prod == 'true' }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Prod Deployment
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Deploy Prod
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: '{"version": "${{ needs.deploy.outputs.image_tag }}"}'

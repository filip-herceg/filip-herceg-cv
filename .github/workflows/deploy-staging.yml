name: Deploy Staging
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (default latest)'
        required: false
      staging_base_url:
        description: 'Override staging base URL for smoke checks'
        required: false
      promote_to_prod:
        description: 'Automatically trigger prod deploy if successful'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
concurrency:
  group: deploy-staging
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
  packages: read
env:
  NAMESPACE: cv-staging
  STAGING_BASE_URL: ''
jobs:
  deploy:
    # environment: staging  # Uncomment after creating the 'staging' environment in repo settings
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (for migrations)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps (prisma only)
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "DATABASE_URL not set - skipping install+migrate"; exit 0; fi
          npm ci --include=dev --ignore-scripts
      - name: Apply migrations
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "DATABASE_URL not set - skipping migrations"; exit 0; fi
          npx prisma migrate deploy
      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull image (validate tag exists)
        run: docker pull ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Resolve staging base URL
        id: resolve_staging_url
        run: |
          base='${{ github.event.inputs.staging_base_url }}'
          if [ -z "$base" ]; then
            echo "No staging base URL provided; health/metrics checks will be skipped"
            echo "STAGING_BASE_URL=" >> $GITHUB_ENV
          else
            echo "Using staging base URL: $base"
            echo "STAGING_BASE_URL=$base" >> $GITHUB_ENV
            echo "url=$base" >> $GITHUB_OUTPUT
          fi
      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install cv ./helm \
            --namespace $NAMESPACE --create-namespace \
            -f helm/values-staging.yaml \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ steps.tag.outputs.tag }} \
            --atomic --timeout 5m
      - name: Wait for healthz
        if: ${{ env.STAGING_BASE_URL != '' }}
        run: |
          set -euo pipefail
          echo "Waiting for $STAGING_BASE_URL/api/healthz"
          for i in $(seq 1 30); do
            if curl -fsS "$STAGING_BASE_URL/api/healthz" >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/30 failed; retrying in 10s"
            sleep 10
          done
          echo "Health check failed after 30 attempts" >&2
          exit 1
      - name: Smoke test metrics endpoint
        if: ${{ env.STAGING_BASE_URL != '' }}
        run: |
          set -euo pipefail
          metrics_url="${STAGING_BASE_URL%/}/api/metrics"
          echo "Fetching metrics from $metrics_url"
          curl -fsS "$metrics_url" -o metrics.txt
          docker run --rm -i prom/prometheus promtool check metrics < metrics.txt
          rm -f metrics.txt
      - name: Output note
        run: echo "Staging deployed tag=${{ steps.tag.outputs.tag }}"
  promote:
    if: ${{ success() && github.event.inputs.promote_to_prod == 'true' }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Prod Deployment
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Deploy Prod
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: '{"version": "${{ needs.deploy.outputs.image_tag }}"}'

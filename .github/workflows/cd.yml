name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Record pre-upgrade revision (if exists)
        id: pre
        run: |
          set -e
          rev=$(helm history web -n portfolio --max 1 2>/dev/null | awk 'NR==2 {print $1}') || true
          echo "prevRevision=$rev" >> $GITHUB_OUTPUT
      - name: Kube config
        run: |
          kubectl config set-cluster cluster --server="${{ secrets.K8S_SERVER }}" --insecure-skip-tls-verify=true
          kubectl config set-credentials deployer --token="${{ secrets.K8S_TOKEN }}"
          kubectl config set-context ctx --cluster=cluster --user=deployer
          kubectl config use-context ctx
      - name: Create namespace
        run: kubectl get ns portfolio || kubectl create ns portfolio
      - name: Set image tag
        id: img
        run: echo "TAG=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
      - name: Helm dry-run
        run: |
          helm upgrade --install web ./helm \
            --namespace portfolio \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ steps.img.outputs.TAG }} \
            --set ingress.host=${{ secrets.INGRESS_HOST }} \
            --dry-run --debug
      - name: Helm upgrade
        run: |
          helm upgrade --install web ./helm \
            --namespace portfolio \
            --set image.repository=ghcr.io/${{ github.repository }} \
            --set image.tag=${{ steps.img.outputs.TAG }} \
            --set ingress.host=${{ secrets.INGRESS_HOST }}
      - name: Post-upgrade status (describe pod)
        if: always()
        run: kubectl get pods -n portfolio -l app.kubernetes.io/name=web -o wide || true
      - name: Wait for rollout
        run: kubectl rollout status deployment/web -n portfolio --timeout=180s
      - name: Smoke check /healthz
        run: |
          kubectl run curl-tmp -n portfolio --image=curlimages/curl:8.8.0 -i --rm --restart=Never -- curl -fsS http://web:3000/api/healthz
      - name: Export manifests
        run: helm get manifest web -n portfolio > manifest.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-manifest
          path: manifest.yaml
      - name: Rollback on failure
        if: failure() && steps.pre.outputs.prevRevision != ''
        run: |
          echo "Rolling back to revision ${{ steps.pre.outputs.prevRevision }}"
          helm rollback web ${{ steps.pre.outputs.prevRevision }} -n portfolio
          kubectl rollout status deployment/web -n portfolio --timeout=180s || true
      - name: Emit failure context
        if: failure()
        run: |
          echo '--- Events ---'
          kubectl get events -n portfolio --sort-by=.metadata.creationTimestamp | tail -n 50 || true
          echo '--- Pods ---'
          kubectl describe pods -n portfolio -l app.kubernetes.io/name=web || true

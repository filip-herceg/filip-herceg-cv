name: PDF Bench Trend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/**
      - main

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Run PDF benchmark and append trend
        env:
          BENCH_PORT: '3100'
          BENCH_HOST: '127.0.0.1'
          BENCH_ITERS: '8'
          BENCH_OUT: 'reports/bench/pdf.json'
          CV_STORAGE: 'memory'
          CV_AUTO_SEED: 'false'
          CHROMIUM_PATH: '${{ steps.chrome.outputs.chrome-path }}'
        run: npm run bench:pdf:trend

      - name: Upload bench artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-reports
          path: |
            reports/bench/pdf.json
            reports/bench/trend.csv
          if-no-files-found: warn

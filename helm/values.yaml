replicaCount: 2
image:
  repository: ghcr.io/OWNER/filip-herceg-cv
  tag: latest
  # Optional: if provided, overrides tag (supply full digest like sha256:....)
  digest: ""
  pullPolicy: IfNotPresent
ingress:
  enabled: true
  host: yourdomain.tld
  className: nginx
  tlsSecretName: ""
  annotations: {}
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  # Optional memory autoscaling target
  targetMemoryUtilizationPercentage: null
env:
  CONTACT_PROVIDER_API_KEY: ''
  CONTACT_FROM_ADDRESS: 'portfolio@yourdomain.tld'
  CONTACT_TO_ADDRESS: 'you@yourdomain.tld'
  # Observability
  SENTRY_DSN: ''
  SENTRY_TRACES_SAMPLE_RATE: '0.1'
  SENTRY_REPLAYS_SESSION_SAMPLE_RATE: '0'
  SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: '0.5'
  NEXT_PUBLIC_ENV: 'production'
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints:
  enabled: false
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

antiAffinity:
  # When true, prefer scheduling pods on different nodes
  enabled: true
  topologyKey: kubernetes.io/hostname

networkPolicy:
  enabled: true
  # Port exposed by the Service/Ingress targeting containerPort 3000
  port: 80
  # Control allowed ingress sources.
  # Options: "any" (default open), "cidrs", "namespaces", "ingressController"
  allowIngressFrom: ingressController
  # For allowIngressFrom: "cidrs"
  allowedCidrs: []
  # For allowIngressFrom: "namespaces"
  allowedNamespaces: []
  # For allowIngressFrom: "ingressController"
  ingressController:
    namespace: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx
  # Additional egress CIDRs for destinations beyond DNS/HTTPS (e.g., database/private)
  extraEgressCidrs: []

metrics:
  enabled: true
  port: 9464
  serviceMonitor:
    enabled: true
    interval: 30s
  scrapeTimeout: 10s
  labels: {}
  grafanaDashboard:
    enabled: false
    folder: Applications
  alerts:
    enabled: true
    # Utilization alert: busy/total > threshold for duration
    utilization:
      threshold: 0.8
      for: 5m
    # Failure ratio alert: pdf_failures / (pdf_success + pdf_failures) > threshold over window
    failureRatio:
      threshold: 0.01
      window: 15m
      for: 10m
    # Busy ratio alert: share of 503 busy responses over window
    busyRatio:
      threshold: 0.1
      window: 10m
      for: 10m
    # p95 export duration alert in seconds over rate window
    p95DurationSeconds:
      threshold: 2.5
      window: 5m
      for: 15m
    # p95 DOM ready duration high (seconds)
    domP95Seconds:
      threshold: 1.0
      window: 5m
      for: 10m
    # p95 acquire duration (pool contention) in seconds
    acquireP95Seconds:
      threshold: 0.5
      window: 5m
      for: 10m
    # CI bench budget for warm p50 (seconds); compares gauge pdf_bench_warm_p50_seconds
    benchWarmP50Seconds:
      threshold: 0.6
      for: 0m

{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-grafana-dashboard
  labels:
    {{- include "app.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  {{- with .Values.metrics.grafanaDashboard.labels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    {{- if .Values.metrics.grafanaDashboard.folder }}
    grafana_folder: {{ .Values.metrics.grafanaDashboard.folder | quote }}
    {{- end }}
data:
  {{ include "app.fullname" . }}-dashboard.json: |-
    {
      "schemaVersion": 39,
      "title": "CV Platform Overview",
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "panels": [
        {
          "type": "timeseries",
          "id": 1,
          "title": "PDF Requests by Result (rate)",
          "targets": [ { "expr": "sum by (result) (rate(pdf_requests_total[5m]))", "legendFormat": "{{result}}" } ],
          "gridPos": {"h":8,"w":12,"x":0,"y":0}
        },
        {
          "type": "stat",
          "id": 2,
          "title": "PDF Failure Ratio (5m)",
          "targets": [ { "expr": "sum(rate(pdf_requests_total{result=~\"error|timeout\"}[5m])) / clamp_min(sum(rate(pdf_requests_total[5m])), 1)" } ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1, "unit": "percentunit" } },
          "gridPos": {"h":4,"w":6,"x":12,"y":0}
        },
        {
          "type": "stat",
          "id": 3,
          "title": "PDF Busy Ratio (5m)",
          "targets": [ { "expr": "sum(rate(pdf_requests_total{result=\"busy\"}[5m])) / clamp_min(sum(rate(pdf_requests_total[5m])), 1)" } ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1, "unit": "percentunit" } },
          "gridPos": {"h":4,"w":6,"x":18,"y":0}
        },
        {
          "type": "stat",
          "id": 4,
          "title": "PDF Gen p95 (5m)",
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(pdf_generation_duration_seconds_bucket[5m])))" } ],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": {"h":4,"w":6,"x":12,"y":4}
        },
        {
          "type": "stat",
          "id": 5,
          "title": "DOM Ready p95 (5m)",
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(pdf_render_dom_duration_seconds_bucket[5m])))" } ],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": {"h":4,"w":6,"x":18,"y":4}
        },
        {
          "type": "stat",
          "id": 6,
          "title": "Bench Warm p50 (latest)",
          "targets": [ { "expr": "pdf_bench_warm_p50_seconds" } ],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": {"h":4,"w":6,"x":0,"y":8}
        },
        {
          "type": "stat",
          "id": 7,
          "title": "Last PDF Page Count",
          "targets": [ { "expr": "pdf_last_page_count" } ],
          "gridPos": {"h":4,"w":4,"x":6,"y":8}
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "PDF Cache Evictions (rate by backend)",
          "targets": [ { "expr": "sum by (backend) (rate(pdf_cache_evictions_total[5m]))", "legendFormat": "{{backend}}" } ],
          "gridPos": {"h":8,"w":14,"x":10,"y":8}
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "Chromium Pool Pages",
          "targets": [
            { "expr": "chromium_pool_pages_total", "legendFormat": "total" },
            { "expr": "chromium_pool_pages_busy", "legendFormat": "busy" },
            { "expr": "chromium_pool_pages_available", "legendFormat": "available" }
          ],
          "gridPos": {"h":8,"w":12,"x":0,"y":12}
        },
        {
          "type": "gauge",
          "id": 10,
          "title": "Pool Utilization",
          "targets": [ { "expr": "chromium_pool_pages_busy / clamp_min(chromium_pool_pages_total, 1)" } ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1, "unit": "percentunit" } },
          "gridPos": {"h":4,"w":6,"x":12,"y":12}
        },
        {
          "type": "stat",
          "id": 11,
          "title": "Acquire p95 (5m)",
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(chromium_acquire_duration_seconds_bucket[5m])))" } ],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": {"h":4,"w":6,"x":18,"y":12}
        }
      ]
    }
{{- end }}
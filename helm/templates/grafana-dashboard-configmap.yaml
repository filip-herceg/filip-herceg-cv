{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-grafana-dashboard
  labels:
    {{- include "app.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- range $k, $v := .Values.metrics.grafanaDashboard.labels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  annotations:
    {{- if .Values.metrics.grafanaDashboard.folder }}
    grafana_folder: {{ .Values.metrics.grafanaDashboard.folder | quote }}
    {{- end }}
data:
  filip-herceg-cv-dashboard.json: |-
    {
      "schemaVersion": 39,
      "title": "CV Platform Overview",
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "PDF Requests by Result (rate)",
          "type": "timeseries",
          "targets": [
            { "expr": "rate(pdf_requests_total[5m])", "legendFormat": "{{result}}" }
          ]
        },
        {
          "id": 2,
          "title": "PDF Cache Entries",
          "type": "stat",
          "targets": [ { "expr": "pdf_cache_entries" } ]
        },
        {
          "id": 3,
          "title": "PDF Cache Hit Ratio",
          "type": "gauge",
          "targets": [ { "expr": "pdf_cache_hits_total / (pdf_cache_hits_total + pdf_cache_misses_total)" } ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1 } }
        },
        {
          "id": 4,
          "title": "Permalink Creates (rate)",
          "type": "timeseries",
          "targets": [ { "expr": "rate(permalink_creates_total[5m])" } ]
        },
        {
          "id": 5,
          "title": "CV Aggregate Loads by Source (rate)",
          "type": "timeseries",
          "targets": [ { "expr": "rate(cv_aggregate_loads_total[5m])", "legendFormat": "{{source}}" } ],
          "description": "Shows frequency of CV aggregate fetches split by 'db' vs 'empty' onboarding placeholder. Aim for 'empty' to drop after initial admin population.",
          "fieldConfig": { "defaults": { "unit": "req/s" } }
        },
        {
          "id": 6,
          "title": "Chromium Pool Enabled",
          "type": "gauge",
          "targets": [ { "expr": "chromium_pool_enabled" } ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1 } }
        },
        {
          "id": 7,
          "title": "Chromium Pool Capacity",
          "type": "stat",
          "targets": [ { "expr": "chromium_pool_max_capacity" } ]
        },
        {
          "id": 8,
          "title": "Chromium Pool Pages (total/busy/available)",
          "type": "timeseries",
          "targets": [
            { "expr": "chromium_pool_pages_total", "legendFormat": "total" },
            { "expr": "chromium_pool_pages_busy", "legendFormat": "busy" },
            { "expr": "chromium_pool_pages_available", "legendFormat": "available" }
          ]
        },
        {
          "id": 9,
          "title": "Chromium Acquire Duration (p95)",
          "type": "timeseries",
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(chromium_acquire_duration_seconds_bucket[5m])))", "legendFormat": "p95" } ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        }
        {
          "id": 10,
          "title": "Chromium Pool Utilization",
          "type": "gauge",
          "targets": [ { "expr": "chromium_pool_pages_busy / clamp_min(chromium_pool_pages_total, 1)" } ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1, "unit": "percentunit" } }
        }
      ]
    }
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-grafana-dashboard
  labels:
    {{- include "app.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- if .Values.metrics.grafanaDashboard.folder }}
    dashboard-folder: {{ .Values.metrics.grafanaDashboard.folder | quote }}
    {{- end }}
data:
  {{ include "app.fullname" . }}-dashboard.json: |
    {
      "__inputs": [],
      "__requires": [{"type":"panel","id":"timeseries","name":"Time series","version":"8.0.0"}],
      "schemaVersion": 38,
      "version": 1,
      "title": "{{ include "app.fullname" . }} Metrics",
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "CPU Usage",
          "targets": [
            { "expr": "rate(process_cpu_seconds_total{job='{{ include "app.fullname" . }}'}[5m])" }
          ],
          "gridPos": {"h":8,"w":12,"x":0,"y":0}
        },
        {
          "type": "timeseries",
          "title": "Memory RSS",
          "targets": [
            { "expr": "process_resident_memory_bytes{job='{{ include "app.fullname" . }}'}" }
          ],
          "gridPos": {"h":8,"w":12,"x":12,"y":0}
        },
        {
          "type": "timeseries",
          "title": "Event Loop Lag",
          "targets": [
            { "expr": "nodejs_eventloop_lag_seconds{job='{{ include "app.fullname" . }}'}" }
          ],
          "gridPos": {"h":8,"w":12,"x":0,"y":8}
        },
        {
          "type": "gauge",
          "title": "Chromium Pool Enabled",
          "targets": [ { "expr": "chromium_pool_enabled{job='{{ include \"app.fullname\" . }}'}" } ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1 } },
          "gridPos": {"h":6,"w":6,"x":12,"y":8}
        },
        {
          "type": "stat",
          "title": "Chromium Pool Capacity",
          "targets": [ { "expr": "chromium_pool_max_capacity{job='{{ include \"app.fullname\" . }}'}" } ],
          "gridPos": {"h":6,"w":6,"x":18,"y":8}
        },
        {
          "type": "timeseries",
          "title": "Chromium Pool Pages",
          "targets": [
            { "expr": "chromium_pool_pages_total{job='{{ include \"app.fullname\" . }}'}", "legendFormat": "total" },
            { "expr": "chromium_pool_pages_busy{job='{{ include \"app.fullname\" . }}'}", "legendFormat": "busy" },
            { "expr": "chromium_pool_pages_available{job='{{ include \"app.fullname\" . }}'}", "legendFormat": "available" }
          ],
          "gridPos": {"h":8,"w":12,"x":0,"y":16}
        },
        {
          "type": "timeseries",
          "title": "Chromium Acquire Duration (p95)",
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(chromium_acquire_duration_seconds_bucket{job='{{ include \"app.fullname\" . }}'}[5m])))", "legendFormat": "p95" } ],
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": {"h":8,"w":12,"x":12,"y":16}
        },
        {
          "type": "gauge",
          "title": "Chromium Pool Utilization",
          "targets": [ { "expr": "chromium_pool_pages_busy{job='{{ include \"app.fullname\" . }}'} / clamp_min(chromium_pool_pages_total{job='{{ include \"app.fullname\" . }}'}, 1)" } ],
          "fieldConfig": { "defaults": { "min": 0, "max": 1, "unit": "percentunit" } },
          "gridPos": {"h":6,"w":6,"x":0,"y":24}
        }
      ]
    }
{{- end }}